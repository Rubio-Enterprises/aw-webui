[tasks."test:ts"]
env = { TZ = "UTC" }
run = [
  "mkdir -p reports/unit",
  "npm test -- --json --outputFile=reports/unit/jest.json",
  """node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync("reports/unit/jest.json")); if (!(report.numPassedTests > 0)) throw new Error("No tests executed"); if (process.env.RUBIO_TEST_GATE_COUNT_OUTPUT) fs.writeFileSync(process.env.RUBIO_TEST_GATE_COUNT_OUTPUT, String(report.numPassedTests));'""",
]

[tasks."test:locales"]
run = ["npm run check:locales"]

[tasks."build:ts"]
run = ["make build", "make build-vite"]
