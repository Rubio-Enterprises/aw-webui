name: test-gate
'on':
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  canonical-tests:
    name: canonical tests
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').medium || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 30
    outputs:
      tests_ran: ${{ steps.test.outputs.tests_ran }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: '0.12.17'
      - uses: Rubio-Enterprises/.github/actions/standards-bootstrap@main
        with:
          app-id: ${{ secrets.STANDARDS_READER_APP_ID }}
          private-key: ${{ secrets.STANDARDS_READER_APP_PRIVATE_KEY }}
      - run: mise run setup
      - id: test
        name: Run canonical Jest tests
        env:
          RUBIO_TEST_GATE_COUNT_OUTPUT: ${{ runner.temp }}/test-gate-count
        run: |
          set -euo pipefail
          rm -f "$RUBIO_TEST_GATE_COUNT_OUTPUT"
          mise run test
          test -s "$RUBIO_TEST_GATE_COUNT_OUTPUT"
          test "$(cat "$RUBIO_TEST_GATE_COUNT_OUTPUT")" -gt 0
          echo "tests_ran=true" >> "$GITHUB_OUTPUT"
  aggregate:
    name: test-gate
    if: ${{ always() }}
    needs: [canonical-tests]
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 10
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Require successful non-empty test execution
        run: >-
          jq -e 'length > 0 and all(.[]; .result == "success" and
          .outputs.tests_ran == "true")' <<<"$NEEDS_JSON"
